services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: libretime
      POSTGRES_PASSWORD: libretime
    healthcheck:
      test: pg_isready -U libretime
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_VHOST: /libretime
      RABBITMQ_DEFAULT_USER: libretime
      RABBITMQ_DEFAULT_PASS: libretime
    healthcheck:
      test: nc -z 127.0.0.1 5672
      interval: 10s
      timeout: 5s
      retries: 5

  playout:
    image: ghcr.io/libretime/libretime-playout:latest
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
      - libretime_playout:/app
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  liquidsoap:
    image: ghcr.io/libretime/libretime-playout:latest
    command: /usr/local/bin/libretime-liquidsoap
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    ports:
      # Puerto principal - RadioBoss, VirtualDJ, BUTT, Mixxx
      - "8001:8001"
      # Puerto secundario - Shows en vivo
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
      - libretime_playout:/app
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  analyzer:
    image: ghcr.io/libretime/libretime-analyzer:latest
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
      - libretime_storage:/srv/libretime
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  worker:
    image: ghcr.io/libretime/libretime-worker:latest
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  api:
    image: ghcr.io/libretime/libretime-api:latest
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
      - libretime_storage:/srv/libretime
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  legacy:
    image: ghcr.io/libretime/libretime-legacy:latest
    restart: unless-stopped
    init: true
    ulimits:
      nofile: 1024
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yml:/etc/libretime/config.yml:ro
      - libretime_storage:/srv/libretime
    environment:
      LIBRETIME_GENERAL_PUBLIC_URL: http://nginx:8080

  nginx:
    image: ghcr.io/libretime/libretime-nginx:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - legacy
      - api
    volumes:
      - libretime_storage:/srv/libretime:ro

  icecast:
    image: ghcr.io/libretime/icecast:2.4.4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: KusRadio2026!
      ICECAST_ADMIN_PASSWORD: KusAdmin2026!
      ICECAST_RELAY_PASSWORD: KusRelay2026!

  # Servidor de documentacion
  docs:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # Cloudflare Tunnel para time.kusmedios.lat
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
      - icecast

volumes:
  postgres_data:
  libretime_storage:
  libretime_playout:
