    # Puerto secundario para shows en vivo
    show:
      mount: show
      port: 8002
      secure: false

  outputs:
    icecast:
      # Stream principal OGG alta calidad
      - enabled: true
        host: icecast
        port: 8000
        mount: live
        source_password: KusRadio2026!
        admin_password: KusAdmin2026!
        audio:
          format: ogg
          bitrate: 256
        name: EstacionKusmedios
        description: Potenciado por EstacionKusmedios - Multi Radio
        website: https://estacionkusmedios.org
        genre: various

